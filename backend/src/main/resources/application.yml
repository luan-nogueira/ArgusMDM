spring:
  application:
    name: mdm-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mdm_db}
    username: ${DB_USER:mdm_user}
    password: ${DB_PASSWORD:mdm_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cache:
    type: redis
    redis:
      time-to-live: 300000

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  show-actuator: false

mdm:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-min-256-bits-please-override-in-prod}
    access-token-expiration-ms: ${JWT_ACCESS_EXP:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXP:604800000}
    issuer: argus-mdm
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  rate-limit:
    login:
      capacity: 10
      refill-tokens: 10
      refill-duration-seconds: 60
  device:
    offline-threshold-minutes: 15
    low-battery-threshold-percent: 15
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:classpath:firebase/firebase-service-account.json}
    enabled: ${FIREBASE_ENABLED:false}
  admin:
    seed-enabled: ${ADMIN_SEED_ENABLED:true}
    name: ${ADMIN_NAME:Administrador}
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:change-this-password}

logging:
  level:
    root: INFO
    com.tactio.mdm: DEBUG
    org.hibernate.SQL: WARN
